<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" role="img" aria-labelledby="title desc">
  <title id="title">Fieldlight architecture layers</title>
  <desc id="desc">A layered architecture diagram showing how Fieldlight separates private memory, governance, runtime exchange, publication boundaries, and public work.</desc>
  <rect width="760" height="620" fill="#f5f7fa"/>
  <rect x="42" y="42" width="676" height="536" fill="#ffffff" stroke="#d9e0e7" stroke-width="2"/>

  <g font-family="Inter, Arial, sans-serif" letter-spacing="0">
    <text x="70" y="91" fill="#102131" font-size="27" font-weight="800">Fieldlight Architecture</text>
    <text x="70" y="120" fill="#5b6875" font-size="15">A layered system for human-owned AI collaboration</text>
  </g>

  <g fill="none" stroke="#c2ced9" stroke-width="2.2" stroke-linecap="round">
    <path d="M380 226 L380 242"/>
    <path d="M380 304 L380 320"/>
    <path d="M380 382 L380 398"/>
    <path d="M380 460 L380 476"/>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <g>
      <rect x="70" y="164" width="620" height="62" rx="4" fill="#102131"/>
      <text x="96" y="191" fill="#ffffff" font-size="16" font-weight="800">01 · Source Truth</text>
      <text x="96" y="213" fill="#cdd8e3" font-size="12.5">Private memory, canon, identity, source records, and author-controlled context.</text>
      <text x="630" y="202" fill="#cdd8e3" font-size="11.5" font-weight="800" text-anchor="end">PRIVATE</text>
    </g>

    <g>
      <rect x="70" y="242" width="620" height="62" rx="4" fill="#2f6f5e"/>
      <text x="96" y="269" fill="#ffffff" font-size="16" font-weight="800">02 · Governance</text>
      <text x="96" y="291" fill="#d8eee8" font-size="12.5">Consent gates, authorship boundaries, policy scaffolds, and traceable permission.</text>
      <text x="630" y="280" fill="#d8eee8" font-size="11.5" font-weight="800" text-anchor="end">CONTROL</text>
    </g>

    <g>
      <rect x="70" y="320" width="620" height="62" rx="4" fill="#245c82"/>
      <text x="96" y="347" fill="#ffffff" font-size="16" font-weight="800">03 · Runtime Exchange</text>
      <text x="96" y="369" fill="#dbe9f2" font-size="12.5">Routing, trust levels, fallbacks, message contracts, validation, and audit traces.</text>
      <text x="630" y="358" fill="#dbe9f2" font-size="11.5" font-weight="800" text-anchor="end">RUNTIME</text>
    </g>

    <g>
      <rect x="70" y="398" width="620" height="62" rx="4" fill="#a83f3f"/>
      <text x="96" y="425" fill="#ffffff" font-size="16" font-weight="800">04 · Publication Boundary</text>
      <text x="96" y="447" fill="#f7dcdc" font-size="12.5">Drafts, exports, summaries, and releases separated from private source truth.</text>
      <text x="630" y="436" fill="#f7dcdc" font-size="11.5" font-weight="800" text-anchor="end">RELEASE</text>
    </g>

    <g>
      <rect x="70" y="476" width="620" height="62" rx="4" fill="#a07422"/>
      <text x="96" y="503" fill="#ffffff" font-size="16" font-weight="800">05 · Public Work</text>
      <text x="96" y="525" fill="#f2e3c4" font-size="12.5">Essays, protocols, repositories, demos, and analysis that can be inspected.</text>
      <text x="630" y="514" fill="#f2e3c4" font-size="11.5" font-weight="800" text-anchor="end">PUBLIC</text>
    </g>
  </g>
</svg>
