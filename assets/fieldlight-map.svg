<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" role="img" aria-labelledby="title desc">
  <title id="title">Fieldlight system map</title>
  <desc id="desc">A layered map connecting private source truth, memory governance, consent exchange, runtime transport, publication boundaries, and public analysis.</desc>
  <rect width="760" height="620" fill="#f5f7fa"/>
  <rect x="42" y="42" width="676" height="536" fill="#ffffff" stroke="#d9e0e7" stroke-width="2"/>
  <g font-family="Inter, Arial, sans-serif" letter-spacing="0">
    <text x="70" y="91" fill="#102131" font-size="27" font-weight="800">Fieldlight System Map</text>
    <text x="70" y="120" fill="#5b6875" font-size="15">Human-owned AI collaboration infrastructure</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#9fb0c1"/>
    </marker>
  </defs>

  <g font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="800" fill="#6f7f8f" letter-spacing="0.08em">
    <text x="72" y="178">PRIVATE SOURCE</text>
    <text x="302" y="178">CONTROLLED EXCHANGE</text>
    <text x="510" y="178">PUBLIC ARTIFACTS</text>
  </g>

  <g fill="none" stroke="#b8c6d3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M288 245 L314 288" marker-end="url(#arrow)"/>
    <path d="M288 375 L314 332" marker-end="url(#arrow)"/>
    <path d="M470 288 L508 245" marker-end="url(#arrow)"/>
    <path d="M470 332 L508 375" marker-end="url(#arrow)"/>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <g>
      <rect x="72" y="200" width="216" height="92" rx="4" fill="#102131"/>
      <text x="96" y="234" fill="#ffffff" font-size="16" font-weight="800">Source Truth</text>
      <text x="96" y="260" fill="#cdd8e3" font-size="12.5">private memory · canon</text>
      <text x="96" y="278" fill="#cdd8e3" font-size="12.5">identity · source records</text>
    </g>
    <g>
      <rect x="72" y="328" width="216" height="92" rx="4" fill="#2f6f5e"/>
      <text x="96" y="362" fill="#ffffff" font-size="16" font-weight="800">Governance</text>
      <text x="96" y="388" fill="#d8eee8" font-size="12.5">consent · authorship</text>
      <text x="96" y="406" fill="#d8eee8" font-size="12.5">policy · boundaries</text>
    </g>
    <g>
      <rect x="314" y="262" width="156" height="96" rx="4" fill="#245c82"/>
      <text x="360" y="298" fill="#ffffff" font-size="16" font-weight="800">Runtime</text>
      <text x="342" y="324" fill="#dbe9f2" font-size="12.5">routing · trust levels</text>
      <text x="342" y="342" fill="#dbe9f2" font-size="12.5">fallbacks · audit traces</text>
    </g>
    <g>
      <rect x="508" y="200" width="210" height="92" rx="4" fill="#a83f3f"/>
      <text x="532" y="234" fill="#ffffff" font-size="16" font-weight="800">Publication Boundary</text>
      <text x="532" y="260" fill="#f7dcdc" font-size="12.5">draft · export · release</text>
      <text x="532" y="278" fill="#f7dcdc" font-size="12.5">public/private separation</text>
    </g>
    <g>
      <rect x="508" y="328" width="210" height="92" rx="4" fill="#a07422"/>
      <text x="532" y="362" fill="#ffffff" font-size="16" font-weight="800">Public Analysis</text>
      <text x="532" y="388" fill="#f2e3c4" font-size="12.5">essays · protocols</text>
      <text x="532" y="406" fill="#f2e3c4" font-size="12.5">repos · demos</text>
    </g>
  </g>

  <g font-family="Inter, Arial, sans-serif" font-size="13" fill="#5b6875">
    <text x="70" y="500">Design principle: separate private source truth from public artifacts</text>
    <text x="70" y="522">while keeping consent, provenance, and auditability traceable.</text>
    <text x="70" y="551">The goal is inspectable system behavior, not just better language about ethics.</text>
  </g>
</svg>
