<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Fieldlight</title>
  <desc id="description">The Fieldlight field diagram: fine concentric rings, an illuminated violet axis, and an open bracket on a deep blue architectural grid.</desc>
  <defs>
    <radialGradient id="ground" cx="54%" cy="48%" r="72%">
      <stop offset="0" stop-color="#12283b"/>
      <stop offset=".62" stop-color="#0a1d2e"/>
      <stop offset="1" stop-color="#061523"/>
    </radialGradient>
    <linearGradient id="axis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a98cff"/>
      <stop offset=".5" stop-color="#8862e6"/>
      <stop offset="1" stop-color="#a98cff"/>
    </linearGradient>
    <filter id="axisGlow" x="-180%" y="-20%" width="460%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="fieldGlow" cx="54%" cy="50%" r="46%">
      <stop offset="0" stop-color="#8d67e8" stop-opacity=".12"/>
      <stop offset="1" stop-color="#8d67e8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="66" fill="url(#ground)"/>
  <circle cx="278" cy="256" r="238" fill="url(#fieldGlow)"/>

  <g fill="none" stroke="#8290a2" stroke-width="2">
    <path d="M78 0V512M188 0V512M278 0V512M344 0V512M424 0V512M480 0V512" stroke-opacity=".09"/>
    <path d="M0 94H512M0 256H512M0 382H512M0 456H512" stroke-opacity=".07"/>
    <path d="M424 0V512M480 0V512" stroke-opacity=".12" stroke-dasharray="9 11"/>
  </g>

  <g fill="none" stroke="#8c98a8" stroke-width="2">
    <circle cx="278" cy="256" r="228" stroke-opacity=".16"/>
    <circle cx="278" cy="256" r="194" stroke-opacity=".19"/>
    <circle cx="278" cy="256" r="158" stroke-opacity=".16"/>
    <circle cx="278" cy="256" r="122" stroke-opacity=".14"/>
    <circle cx="278" cy="256" r="84" stroke-opacity=".12"/>
    <circle cx="278" cy="256" r="104" stroke-opacity=".1" stroke-dasharray="7 9"/>
  </g>
  <circle cx="278" cy="256" r="194" fill="none" stroke="#c49a55" stroke-opacity=".14" stroke-width="2" stroke-dasharray="305 155 190 330" transform="rotate(-24 278 256)"/>

  <path d="M278 48V464" fill="none" stroke="#8d67e8" stroke-opacity=".52" stroke-width="18" stroke-linecap="round" filter="url(#axisGlow)"/>
  <path d="M278 48V464" fill="none" stroke="url(#axis)" stroke-width="5" stroke-linecap="round"/>
  <g fill="#0a1d2e" stroke="#a98cff" stroke-width="4">
    <circle cx="278" cy="48" r="9"/>
    <circle cx="278" cy="464" r="9"/>
  </g>

  <path d="M442 104V140H422C441 140 454 153 454 172V340C454 359 441 372 422 372H442V408" fill="none" stroke="#9b73ef" stroke-width="4"/>
  <path d="M432 124H454M432 388H454" fill="none" stroke="#9b73ef" stroke-opacity=".34" stroke-width="2"/>

  <g fill="none" stroke="#d3a544" stroke-width="2" stroke-opacity=".72">
    <path d="M470 24H506M488 6V42"/>
    <circle cx="488" cy="24" r="7"/>
    <path d="M470 488H506M488 470V506"/>
    <circle cx="488" cy="488" r="7"/>
    <path d="M486 244V256M486 268V280" stroke-width="3"/>
    <path d="M18 24H28M34 24H44M50 24H60" stroke-width="3"/>
  </g>
</svg>
