<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Fieldlight</title>
  <desc id="description">A contained Fieldlight field diagram with concentric rings, an illuminated violet axis, an open bracket, and gold registration marks.</desc>
  <defs>
    <radialGradient id="ground" cx="50%" cy="48%" r="74%">
      <stop offset="0" stop-color="#132a3e"/>
      <stop offset=".64" stop-color="#0a1d2e"/>
      <stop offset="1" stop-color="#061523"/>
    </radialGradient>
    <linearGradient id="axis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ae92ff"/>
      <stop offset=".5" stop-color="#8862e6"/>
      <stop offset="1" stop-color="#ae92ff"/>
    </linearGradient>
    <radialGradient id="fieldGlow" cx="49%" cy="50%" r="48%">
      <stop offset="0" stop-color="#8d67e8" stop-opacity=".12"/>
      <stop offset="1" stop-color="#8d67e8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="64" fill="url(#ground)"/>
  <rect x="18" y="18" width="476" height="476" rx="49" fill="none" stroke="#c99d46" stroke-opacity=".42" stroke-width="3"/>
  <circle cx="250" cy="256" r="190" fill="url(#fieldGlow)"/>

