    <circle cx="250" cy="256" r="122" stroke-opacity=".17"/>
    <circle cx="250" cy="256" r="95" stroke-opacity=".15"/>
    <circle cx="250" cy="256" r="68" stroke-opacity=".13"/>
    <circle cx="250" cy="256" r="83" stroke-opacity=".1" stroke-dasharray="7 9"/>
